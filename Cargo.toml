# A virtual workspace rather than a package at the root. `core/` is the
# published crate and `xtask/` runs the gates.
#
# The split is not cosmetic. While the crate sat at the repository root, its
# package directory *was* the repository root, so `cargo stern4rust` walked
# `xtask/tests/**` and reported 78 offences for test functions "in the source
# tree" -- test files belonging to a different package entirely. Scoping by
# `--package` does not help, because the scope is the directory. Giving each
# crate its own directory is what separates them.
[workspace]
members = ["core", "xtask"]
resolver = "3"

# Declared once here; every member takes them with `.workspace = true`, so a
# version is bumped in one place and no two members can disagree.
[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
authors = ["Umberto Gotti <umberto.gotti@umbertogotti.dev>"]
license = "MIT"
repository = "https://github.com/umbgtt10/twin4rust"

[workspace.dependencies]
anyhow = "1.0.98"
cargo_metadata = "0.23.1"
clap = { version = "4.6.0", features = ["derive"] }
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0.117", features = ["full", "visit"] }
walkdir = "2.5.0"
