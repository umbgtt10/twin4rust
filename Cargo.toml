[package]
name = "cargo-twin4rust"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
authors = ["Umberto Gotti <umberto.gotti@umbertogotti.dev>"]
description = "Cargo subcommand that fails the build when a Rust source file has no mirrored test file beside it"
license = "MIT"
readme = "README.md"
repository = "https://github.com/umbgtt10/twin4rust"
documentation = "https://docs.rs/cargo-twin4rust"
keywords = ["cargo", "subcommand", "testing", "coverage", "cli"]
categories = ["development-tools::cargo-plugins", "development-tools::testing", "command-line-utilities"]

autotests = false

[lib]
name = "twin4rust"

[[bin]]
name = "cargo-twin4rust"
path = "src/main.rs"

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"

[dependencies]
anyhow = "1.0.98"
cargo_metadata = "0.23.1"
clap = { version = "4.6.0", features = ["derive"] }
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0.117", features = ["full", "visit"] }
walkdir = "2.5.0"

[dev-dependencies]
clap = { version = "4.6.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0.117", features = ["full", "visit"] }
